# Nginx API Gateway Configuration for AI FAQ Platform
# Main configuration file with upstream definitions and routing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Load dynamic modules
load_module modules/ngx_http_realip_module.so;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic Settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 2M;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Real IP Configuration (for load balancers)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    
    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    
    # Connection Limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # Upstream Definitions
    
    # Authorization Service (Port 3000)
    upstream auth_service {
        least_conn;
        server auth-service:3000 max_fails=3 fail_timeout=30s;
        # Add more instances for high availability
        # server auth-service-2:3000 max_fails=3 fail_timeout=30s backup;
        
        # Health check (requires nginx-plus or custom module)
        # health_check interval=10s fails=3 passes=2;
    }
    
    # Content Service (Port 3002)
    upstream content_service {
        least_conn;
        server content-service:3002 max_fails=3 fail_timeout=30s;
        # server content-service-2:3002 max_fails=3 fail_timeout=30s backup;
    }
    
    # Chat Service (Port 3003)
    upstream chat_service {
        least_conn;
        server chat-service:3003 max_fails=3 fail_timeout=30s;
        # server chat-service-2:3003 max_fails=3 fail_timeout=30s backup;
    }
    
    # AI Processing Service (Port 3004 - assuming different port for clarity)
    upstream ai_processing_service {
        least_conn;
        server ai-processing-service:3004 max_fails=3 fail_timeout=30s;
        # server ai-processing-service-2:3004 max_fails=3 fail_timeout=30s backup;
    }
    
    # Logging Format
    log_format api_gateway_format '$remote_addr - $remote_user [$time_local] '
                                  '"$request" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  '$request_time $upstream_response_time '
                                  '$upstream_addr $upstream_status '
                                  'org_id="$http_x_org_id" user_id="$http_x_user_id"';
    
    access_log /var/log/nginx/access.log api_gateway_format;
    
    # Security Headers Map
    map $sent_http_content_type $security_headers {
        ~*text/html "nosniff";
        default "";
    }
    
    # Main Server Block
    server {
        listen 80;
        listen [::]:80;
        server_name api.faq-platform.local localhost;
        
        # Security Headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; frame-ancestors 'none';" always;
        
        # Connection limiting
        limit_conn conn_limit_per_ip 20;
        
        # Health Check Endpoint
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        # API Gateway Info
        location / {
            return 200 '{"service":"AI FAQ Platform API Gateway","version":"1.0.0","endpoints":["/v1/auth","/v1/documents","/v1/chat","/v1/ai-processing"],"documentation":"/docs"}';
            add_header Content-Type application/json;
        }
        
        # Authentication Service Routes
        location /v1/auth/ {
            # Rate limiting for auth endpoints
            limit_req zone=auth_limit burst=10 nodelay;
            
            # Proxy settings
            proxy_pass http://auth_service/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Source "nginx-api-gateway";
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # Cache settings for auth endpoints (minimal caching)
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }
        
        # Organization Management Routes
        location /v1/org/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://auth_service/v1/org/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Source "nginx-api-gateway";
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
        
        # User Management Routes
        location /v1/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://auth_service/v1/users/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Source "nginx-api-gateway";
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
        
        # Content/Document Management Routes
        location /v1/documents/ {
            # Higher rate limit for file uploads
            limit_req zone=upload_limit burst=5 nodelay;
            
            # Increase client body size for file uploads
            client_max_body_size 50M;
            
            proxy_pass http://content_service/v1/documents/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Source "nginx-api-gateway";
            
            # Extended timeouts for file operations
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Request buffering for large files
            proxy_request_buffering off;
            proxy_buffering off;
        }
        
        # Chat Service Routes
        location /v1/chat/ {
            limit_req zone=api_limit burst=15 nodelay;
            
            proxy_pass http://chat_service/v1/chat/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Source "nginx-api-gateway";
            
            # Extended timeouts for AI processing
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Disable buffering for streaming responses
            proxy_buffering off;
            proxy_cache off;
        }
        
        # AI Processing Service Routes (Internal/Admin)
        location /v1/ai-processing/ {
            # Restricted access - consider IP whitelisting
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;
            
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://ai_processing_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-Source "nginx-api-gateway";
            
            # Very long timeouts for AI processing
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        
        # Service Health Checks (Proxied)
        location /health/auth {
            access_log off;
            proxy_pass http://auth_service/health;
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }
        
        location /health/content {
            access_log off;
            proxy_pass http://content_service/health;
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }
        
        location /health/chat {
            access_log off;
            proxy_pass http://chat_service/health;
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }
        
        # API Documentation Aggregation
        location /docs {
            return 301 /docs/;
        }
        
        location /docs/ {
            # Serve a custom API documentation page
            root /usr/share/nginx/html;
            try_files $uri $uri/ /docs/index.html;
        }
        
        location /docs/auth {
            proxy_pass http://auth_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /docs/content {
            proxy_pass http://content_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /docs/chat {
            proxy_pass http://chat_service/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        # Metrics endpoint (should be internal only)
        location /metrics {
            # IP restriction for metrics
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            proxy_pass http://chat_service/metrics;
            proxy_set_header Host $host;
        }
        
        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        # Security: Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security: Block access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # HTTPS Server Block (for production)
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name api.faq-platform.com;
    #     
