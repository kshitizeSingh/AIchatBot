# Advanced Rate Limiting Configuration
# This file contains additional rate limiting rules and configurations

# Rate limiting for different API endpoints
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=moderate_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=generous_limit:10m rate=20r/s;

# Rate limiting by user ID (requires authentication)
limit_req_zone $http_x_user_id zone=user_limit:10m rate=10r/s;

# Rate limiting by organization ID
limit_req_zone $http_x_org_id zone=org_limit:10m rate=50r/s;

# Connection limiting zones
limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
limit_conn_zone $http_x_user_id zone=user_conn:10m;

# Bandwidth limiting
limit_rate_after 1m;
limit_rate 100k;

# Map for rate limiting based on request type
map $request_method $rate_limit_zone {
    default api_limit;
    POST auth_limit;
    PUT upload_limit;
    DELETE strict_limit;
}

# Map for burst limits based on endpoint
map $uri $burst_limit {
    default 10;
    ~^/v1/auth/ 5;
    ~^/v1/documents/ 3;
    ~^/v1/chat/ 15;
    ~^/health 100;
}