# Security Configuration for Nginx API Gateway
# This file contains security headers and configurations

# Security headers map
map $sent_http_content_type $security_headers {
    ~*text/html "X-Frame-Options: DENY; X-Content-Type-Options: nosniff; X-XSS-Protection: 1; mode=block";
    ~*application/json "X-Content-Type-Options: nosniff";
    default "X-Content-Type-Options: nosniff";
}

# Block common attack patterns
map $request_uri $blocked_uri {
    default 0;
    ~*\.(php|asp|aspx|jsp)$ 1;
    ~*/\.\./ 1;
    ~*/etc/passwd 1;
    ~*/proc/ 1;
    ~*\x00 1;
    ~*\x0a 1;
    ~*\x0d 1;
    ~*\x27 1;
    ~*\x3c 1;
    ~*\x3e 1;
    ~*\x00 1;
}

# Block suspicious user agents
map $http_user_agent $blocked_agent {
    default 0;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*nessus 1;
    ~*masscan 1;
    ~*nmap 1;
    ~*dirbuster 1;
    ~*gobuster 1;
    ~*wget 1;
    ~*curl 1;
    "" 1;  # Empty user agent
}

# Block based on request method
map $request_method $blocked_method {
    default 0;
    TRACE 1;
    TRACK 1;
    DEBUG 1;
    CONNECT 1;
}

# IP whitelist for admin endpoints
geo $admin_ip {
    default 0;
    127.0.0.1 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    # Add your admin IPs here
    # 203.0.113.0/24 1;
}

# Content Security Policy
map $uri $csp_policy {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; frame-ancestors 'none';";
    ~^/docs/ "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:;";
}

# CORS headers map
map $http_origin $cors_origin {
    default "";
    ~^https?://localhost(:[0-9]+)?$ $http_origin;
    ~^https?://.*\.faq-platform\.(local|com)$ $http_origin;
    # Add your allowed origins here
}

# SSL/TLS Configuration (for HTTPS)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

# OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;

